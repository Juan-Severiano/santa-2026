[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "santa2026"
version = "0.1.0"
description = "Exact local validator and arithmetic-program solver for Kaggle Santa 2026."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
santa2026 = "santa2026.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
